<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communicating Your Boundaries</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="activity-container">

        <!-- Header -->
        <header class="activity-header">
            <h1>Communicating Your Boundaries</h1>
            <p class="subtitle">
                Let's practice communicating what we want and need.
            </p>
        </header>

        <!-- Progress -->
        <div class="progress-area">
            <span id="progress-text">Question 1</span>

            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
        </div>

        <!-- Question -->
        <section id="question-screen" class="screen">

            <div class="scenario-box">
                <p id="question-text"></p>
            </div>

            <h2>What would you do?</h2>

            <div id="answer-buttons" class="answer-buttons">
                <!-- Answer buttons are created by JavaScript -->
            </div>

        </section>

        <!-- Feedback -->
        <section id="feedback-screen" class="screen hidden">

            <div id="feedback-box" class="feedback-box">
                <h2 id="feedback-heading">Feedback</h2>
                <p id="feedback-text"></p>
            </div>

            <button id="continue-button" class="primary-button">
                Continue
            </button>

        </section>

        <!-- Results / End -->
        <section id="end-screen" class="screen hidden">

            <div class="end-box">
                <h2>Great work!</h2>

                <p id="end-message">
                    You practiced several ways to communicate your boundaries.
                </p>

                <button id="restart-button" class="primary-button">
                    Start Again
                </button>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
